name: Aprendendo Artefatos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches:
      - "feature/*"
    paths:
      - "src/**"
      - '!src/docs/**'

jobs:
  gerador:
    name: job_gerador
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true
    runs-on: ubuntu-latest
    steps:
      - name: Criar Relatórios Oficiais
        run: |
          mkdir -p saida_build
          echo "Sucesso! Artefato gerado em $(date)" > saida_build/relatorio1.txt
          echo "Sucesso! Artefato gerado em $(date)" > saida_build/relatorio2.txt

      - name: Salvar Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: meus-relatorios-oficiais
          path: saida_build/

  auditoria:
    name: job_auditoria
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true
    runs-on: ubuntu-latest
    needs: [gerador]
    steps:
      - name: Recuperar Artefato
        uses: actions/download-artifact@v4
        with:
          name: meus-relatorios-oficiais

      - name: Exibir Conteúdo
        run: cat relatorio1.txt
