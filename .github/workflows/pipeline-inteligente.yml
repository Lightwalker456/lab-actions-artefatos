name: Aprendendo Artefatos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches:
      - "feature/*"
    paths:
      - "src/**"
      - '!src/docs/**'

jobs:
  gerador:
    name: job_gerador
    runs-on: ubuntu-latest
    steps:
      - name: Criar Relatórios Oficiais
        run: echo "Sucesso! Artefato gerado em $(date)" > relatorio1.txt
             echo "Sucesso! Artefato gerado em $(date)" > relatorio2.txt

      - name: Salvar Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: meus-relatorios-oficiais
          path: saida_build/

  auditoria:
    name: job_auditoria
    runs-on: ubuntu-latest
    needs: [job_gerador]
    steps:
      - name: Recuperar Artefato
        uses: actions/download-artifact@v4
        with:
          name: meus-relatorios-oficiais

      - name: Exibir Conteúdo
        run: cat saida_build/
             cat relatorio1.txt
